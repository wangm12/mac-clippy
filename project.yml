    info:
      path: MacClippy/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSAccessibilityUsageDescription: Mac Clippy uses Accessibility access to paste clipboard items into the active app and expand Snippets.
        NSInputMonitoringUsageDescription: Mac Clippy uses Input Monitoring to detect the global clipboard shortcut and Snippet trigger keystrokes.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.macallyouneed.macclippy.record-id
            UTTypeDescription: MacClippy Record ID
            UTTypeConformsTo:
              - public.data
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.macallyouneed.macclippy
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MacClippy/MacClippy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - package: MacClippyKit
        product: MacClippyCore
      - package: MacClippyKit
        product: MacClippyPlatform
      - sdk: QuickLookUI.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework

  MacClippyE2E:
    type: application
    platform: macOS
    sources:
      - path: MacClippy
        excludes:
          - Info.plist
          - E2E-Info.plist
          - MacClippy.entitlements
    settings:
      base:
        PRODUCT_NAME: MacClippyE2E
        PRODUCT_BUNDLE_IDENTIFIER: com.macallyouneed.macclippy.e2e
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: MacClippy/MacClippy.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: MacClippy/E2E-Info.plist
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MACCLIPPY_E2E"
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - package: MacClippyKit
        product: MacClippyCore
      - package: MacClippyKit
        product: MacClippyPlatform
      - sdk: QuickLookUI.framework
      - sdk: AVKit.framework
      - sdk: AVFoundation.framework

  MacClippyTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MacClippyTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - target: MacClippy
      - package: MacClippyKit
        product: MacClippyCore
      - package: MacClippyKit
        product: MacClippyPlatform

  MacClippyUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: MacClippyUITests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.macallyouneed.macclippy.uitests
        SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    dependencies:
      - target: MacClippyE2E

schemes:
  MacClippy:
    build:
      targets:
        MacClippy: all
        MacClippyTests: [test]
        MacClippyUITests: [test]
    test:
      targets:
        - MacClippyTests
        - MacClippyUITests

  MacClippyE2E:
    build:
      targets:
        MacClippyE2E: all
