name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macclippy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/verify-tool-versions.sh
      - name: Import stable signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh
      - name: Package Release DMG
        run: make dmg
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacClippy.dmg
          path: dist/MacClippy.dmg
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/MacClippy.dmg --clobber
          else
            gh release create "$tag" dist/MacClippy.dmg \
              --title "Mac Clippy ${tag#v}" \
              --generate-notes \
              --verify-tag
          fi
