# Stable tags and main-only nightlies, always gated by the successful required
# MacClippy CI workflow for the exact source SHA that this workflow checks out.
# Optional signing secrets remain imported by scripts/import-signing-cert.sh.

name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  actions: read
  contents: write

# All releases mutate shared GitHub release assets. Serialize stable and nightly
# attempts together; never cancel an in-progress mutation.
concurrency:
  group: macclippy-release-artifacts
  cancel-in-progress: false

jobs:
  release:
    name: Verify, build, and publish
    runs-on: macos-26
    # The required CI workflow can run for 90 minutes. Keep two hours for its
    # completion/visibility window and one more hour for release packaging.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Verify checkout and event target are the build source SHA
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [[ "${checkout_sha}" != "${GITHUB_SHA}" ]]; then
            echo "error: checkout ${checkout_sha} does not match event SHA ${GITHUB_SHA}" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            tag_sha="$(git rev-parse "${GITHUB_REF}^{commit}")"
            if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
              echo "error: tag target ${tag_sha} does not match event SHA ${GITHUB_SHA}" >&2
              exit 1
            fi
          elif [[ "${GITHUB_REF}" != refs/heads/main ]]; then
            echo "error: nightly releases are allowed only from refs/heads/main" >&2
            exit 1
          fi

      - name: Verify successful required CI for this exact SHA
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          REQUIRED_CI_WAIT_SECONDS: "7200"
          REQUIRED_CI_POLL_SECONDS: "15"
        run: ./scripts/verify-required-ci.sh "${GITHUB_SHA}"

      - name: Select and validate release version
        id: version
        run: ./scripts/select-release-version.sh

      - name: Install pinned build tools
        run: ./scripts/install-pinned-tools.sh

      - name: Import optional Developer ID signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh

      - name: Build and package version-checked artifacts
        env:
          MARKETING_VERSION: ${{ steps.version.outputs.marketing_version }}
          CURRENT_PROJECT_VERSION: ${{ steps.version.outputs.build_version }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
          VOLUME_NAME: ${{ steps.version.outputs.volume_name }}
        run: |
          set -euo pipefail
          make dmg \
            MARKETING_VERSION="${MARKETING_VERSION}" \
            CURRENT_PROJECT_VERSION="${CURRENT_PROJECT_VERSION}" \
            ARTIFACT_NAME="${ARTIFACT_NAME}" \
            VOLUME_NAME="${VOLUME_NAME}"

      - name: Upload installers and checksums
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            dist/${{ steps.version.outputs.artifact_name }}.dmg
            dist/${{ steps.version.outputs.artifact_name }}.zip
            dist/${{ steps.version.outputs.artifact_name }}-SHA256SUMS.txt
          if-no-files-found: error

      # This tag mutation stays in the same non-canceling global release lane
      # as stable/nightly asset changes.
      - name: Update the nightly source tag
        if: steps.version.outputs.release_kind == 'nightly'
        run: ./scripts/retarget-nightly-tag.sh "${GITHUB_SHA}"

      - name: Publish stable release
        if: steps.version.outputs.release_kind == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          files=(
            "dist/${ARTIFACT_NAME}.dmg"
            "dist/${ARTIFACT_NAME}.zip"
            "dist/${ARTIFACT_NAME}-SHA256SUMS.txt"
          )
          notes="Built from commit ${GITHUB_SHA} after successful MacClippy CI checks for this same SHA."
          if gh release view "${tag}" --json isPrerelease -q '.isPrerelease' >/dev/null 2>&1; then
            is_prerelease="$(gh release view "${tag}" --json isPrerelease -q '.isPrerelease')"
            if [[ "${is_prerelease}" != "false" ]]; then
              echo "error: existing stable tag ${tag} is marked as a prerelease" >&2
              exit 1
            fi
            while IFS= read -r old_asset; do
              case "${old_asset}" in
                MacClippy*.dmg|MacClippy*.zip|MacClippy*-SHA256SUMS.txt|SHA256SUMS.txt) ;;
                *) continue ;;
              esac
              keep_asset=false
              for current_file in "${files[@]}"; do
                [[ "${old_asset}" == "${current_file##*/}" ]] && keep_asset=true
              done
              if [[ "${keep_asset}" != true ]]; then
                gh release delete-asset "${tag}" "${old_asset}" --yes
              fi
            done < <(gh release view "${tag}" --json assets -q '.assets[].name')
            gh release upload "${tag}" "${files[@]}" --clobber
          else
            gh release create "${tag}" "${files[@]}" \
              --title "Mac Clippy ${tag#v}" \
              --notes "${notes}" \
              --verify-tag \
              --latest
          fi

      - name: Publish main nightly
        if: steps.version.outputs.release_kind == 'nightly'
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ steps.version.outputs.artifact_name }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:8}"
          files=(
            "dist/${ARTIFACT_NAME}.dmg"
            "dist/${ARTIFACT_NAME}.zip"
            "dist/${ARTIFACT_NAME}-SHA256SUMS.txt"
          )
          notes="Nightly from main, source commit ${GITHUB_SHA}. Bundle version 0.0.0; CFBundleVersion encodes the first six SHA hex digits across valid three-part build components."
          if gh release view nightly >/dev/null 2>&1; then
            while IFS= read -r old_asset; do
              case "${old_asset}" in
                MacClippy*.dmg|MacClippy*.zip|MacClippy*-SHA256SUMS.txt|SHA256SUMS.txt) ;;
                *) continue ;;
              esac
              keep_asset=false
              for current_file in "${files[@]}"; do
                [[ "${old_asset}" == "${current_file##*/}" ]] && keep_asset=true
              done
              if [[ "${keep_asset}" != true ]]; then
                gh release delete-asset nightly "${old_asset}" --yes
              fi
            done < <(gh release view nightly --json assets -q '.assets[].name')
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "${notes}" \
              --prerelease \
              --latest=false
          else
            gh release create nightly "${files[@]}" \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "${notes}" \
              --prerelease \
              --latest=false \
              --verify-tag
          fi
