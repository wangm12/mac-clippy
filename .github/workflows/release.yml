# Build MacClippy (DMG/ZIP) with the repo Makefile and attach it to a GitHub Release.
#
# Every branch push updates the rolling `nightly` prerelease.
# Pushing a tag `v*` publishes a stable release.
#
# Optional secrets (unsigned builds lose TCC on other Macs):
#   MACOS_CERT_P12        base64-encoded Mac Clippy .p12
#   MACOS_CERT_PASSWORD   password for that .p12

name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  release:
    name: Build & Release
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned build tools
        run: ./scripts/install-pinned-tools.sh

      - name: Import stable signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh

      - name: Package Release DMG and ZIP
        run: make dmg

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            dist/MacClippy.dmg
            dist/MacClippy.zip
          if-no-files-found: error

      - name: Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          files=(dist/MacClippy.dmg dist/MacClippy.zip)

          echo "Files to upload:"
          ls -lh "${files[@]}"

          # Stable tag release
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Updating release $tag..."
              gh release upload "$tag" "${files[@]}" --clobber
            else
              echo "Creating release $tag..."
              gh release create "$tag" "${files[@]}" \
                --title "Mac Clippy ${tag#v}" \
                --generate-notes \
                --verify-tag
            fi
            exit 0
          fi

          # Rolling nightly pre-release
          notes="Nightly rolling build from commit ${GITHUB_SHA} on branch ${GITHUB_REF_NAME}."
          if gh release view nightly >/dev/null 2>&1; then
            echo "Updating existing nightly release..."
            gh release upload nightly "${files[@]}" --clobber
            gh release edit nightly \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          else
            echo "Creating initial nightly release..."
            gh release create nightly "${files[@]}" \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
