# Build MacClippy.dmg with the repo Makefile and attach it to a GitHub Release.
#
# Every branch push (and Actions → Release → Run workflow) updates the rolling
# `nightly` prerelease. A vX.Y.Z tag still publishes a stable release.
#
# Optional secrets (unsigned builds lose TCC on other Macs):
#   MACOS_CERT_P12        base64-encoded Mac Clippy .p12
#   MACOS_CERT_PASSWORD   password for that .p12

name: Release

on:
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macclippy-release-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  dmg:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned build tools
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          ./scripts/verify-tool-versions.sh
      - name: Import stable signing certificate
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: ./scripts/import-signing-cert.sh
      - name: Package Release DMG
        run: make dmg
      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacClippy.dmg
          path: dist/MacClippy.dmg
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::7}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            if gh release view "$tag" >/dev/null 2>&1; then
              gh release upload "$tag" dist/MacClippy.dmg --clobber
            else
              gh release create "$tag" dist/MacClippy.dmg \
                --title "Mac Clippy ${tag#v}" \
                --generate-notes \
                --verify-tag
            fi
            exit 0
          fi

          notes="Nightly from ${GITHUB_SHA} on ${GITHUB_REF_NAME}."
          if gh release view nightly >/dev/null 2>&1; then
            gh release upload nightly dist/MacClippy.dmg --clobber
            gh release edit nightly \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          else
            gh release create nightly dist/MacClippy.dmg \
              --title "Mac Clippy nightly (${short_sha})" \
              --notes "$notes" \
              --prerelease \
              --latest=false \
              --target "${GITHUB_SHA}"
          fi
