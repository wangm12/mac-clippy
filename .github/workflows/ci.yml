name: MacClippy CI

on:
  push:
    paths:
      - "**"
  pull_request:
    paths:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macclippy-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Required regression suite
    runs-on: macos-26
    # App tests plus package TSan and opt-in fixtures can exceed an hour on a
    # busy hosted runner. Keep individual step limits as the tight boundaries.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Verify checked-in build inputs
        run: |
          set -euo pipefail
          test -f .swiftlint-baseline.yml
          test -x scripts/lint.sh
          test -f scripts/lint-gate-fixture-test.py
          test -x scripts/verify-dmg.sh
          test -f scripts/pinned-tool-versions.sh
          test -x scripts/install-pinned-tools.sh
          test -x scripts/install-pinned-tools-test.sh
          test -x scripts/verify-tool-versions.sh
          test -x scripts/verify-make-pinned-tools-test.sh
          test -x scripts/clean-build.sh
          test -x scripts/clean-build-test.sh
          test -x scripts/select-codesign-identity.sh
          test -x scripts/select-codesign-identity-test.sh
          test -x scripts/make-signing-cert.sh
          test -x scripts/import-signing-cert.sh
          test -x scripts/resolve-dmg-signing.sh
          test -x scripts/release.sh
          test -x scripts/verify-required-ci.sh
          test -x scripts/verify-required-ci-test.sh
          test -x scripts/select-release-version.sh
          test -x scripts/select-release-version-test.sh
          test -x scripts/verify-build-metadata.sh
          test -x scripts/verify-build-metadata-test.sh
          test -x scripts/assert-opt-in-xctest-log.sh
          test -x scripts/assert-opt-in-xctest-log-test.sh
          test -x scripts/release-script-test.sh
          test -x scripts/package-dmg-path-guard-test.sh
          test -f MacClippyKit/Package.resolved
          test -f MacClippy.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Pinned-tool and Make PATH tests
        run: |
          ./scripts/install-pinned-tools-test.sh
          ./scripts/verify-make-pinned-tools-test.sh
      - name: Safe Make clean test
        run: ./scripts/clean-build-test.sh
      - name: Install pinned build tools
        run: ./scripts/install-pinned-tools.sh
      - name: Generate project
        run: xcodegen generate
      - name: Verify generated project is committed
        run: |
          set -euo pipefail
          git diff --exit-code -- MacClippy.xcodeproj
          test -z "$(git status --porcelain --untracked-files=all -- MacClippy.xcodeproj)"
      - name: SwiftLint baseline gate
        run: ./scripts/lint.sh
      - name: SwiftLint clean and changed-file gate fixtures
        run: python3 scripts/lint-gate-fixture-test.py
      - name: Signing identity selector tests
        run: ./scripts/select-codesign-identity-test.sh
      - name: Release gate and metadata tests
        run: |
          ./scripts/verify-required-ci-test.sh
          ./scripts/select-release-version-test.sh
          ./scripts/verify-build-metadata-test.sh
          ./scripts/assert-opt-in-xctest-log-test.sh
          ./scripts/release-script-test.sh
          PATH=/usr/bin:/bin:/usr/sbin:/sbin ./scripts/package-dmg-path-guard-test.sh
          python3 -m unittest scripts.e2e.test_macclippy_phase5
      - name: Native AppKit event-queue calibration (TSan)
        timeout-minutes: 10
        run: >-
          xcodebuild test -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/ci-app-tsan
          -resultBundlePath build/ci-chrome-tsan.xcresult
          -parallel-testing-enabled NO -maximum-parallel-testing-workers 1
          -only-testing:MacClippyTests/MacClippyChromeHitTargetTests
          -enableThreadSanitizer YES -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
      - name: Native chrome GUI regression
        timeout-minutes: 20
        run: |
          set -euo pipefail
          python3 scripts/e2e/macclippy-phase5.py prepare > build/ci-ui-fixture.json
          export MACCLIPPY_E2E_ROOT="$(python3 -c 'import json; print(json.load(open("build/ci-ui-fixture.json"))["root"])')"
          export MACCLIPPY_E2E_RUN_ID="$(python3 -c 'import json; print(json.load(open("build/ci-ui-fixture.json"))["runID"])')"
          export TEST_RUNNER_MACCLIPPY_E2E_ROOT="${MACCLIPPY_E2E_ROOT}"
          export TEST_RUNNER_MACCLIPPY_E2E_RUN_ID="${MACCLIPPY_E2E_RUN_ID}"
          cleanup_fixture() {
            python3 scripts/e2e/macclippy-phase5.py request \
              --root "${MACCLIPPY_E2E_ROOT}" --run-id "${MACCLIPPY_E2E_RUN_ID}" \
              --control-command terminate --socket-timeout 5 >/dev/null 2>&1 || true
            python3 scripts/e2e/macclippy-phase5.py soak clean \
              --root "${MACCLIPPY_E2E_ROOT}" --run-id "${MACCLIPPY_E2E_RUN_ID}"
          }
          trap cleanup_fixture EXIT
          xcodebuild test -project MacClippy.xcodeproj -scheme MacClippy \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/ci-app-tsan -resultBundlePath build/ci-ui-tests.xcresult \
            -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 \
            -only-testing:MacClippyUITests -enableThreadSanitizer YES \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/ci-ui-tests.log
          ./scripts/assert-opt-in-xctest-log.sh build/ci-ui-tests.log MacClippyUITests
      - name: Package tests
        run: swift test --package-path MacClippyKit
      - name: Strict concurrency package tests
        run: swift test --package-path MacClippyKit -Xswiftc -strict-concurrency=complete
      - name: Package scale regression fixture (opt-in)
        timeout-minutes: 10
        env:
          MACCLIPPY_RUN_SCALE_TESTS: "1"
          TEST_RUNNER_MACCLIPPY_RUN_SCALE_TESTS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/ci-scale-package
          log_file=build/ci-scale-package/swift-test.log
          swift test --package-path MacClippyKit --filter MacClippyScaleTests 2>&1 | tee "${log_file}"
          ./scripts/assert-opt-in-xctest-log.sh "${log_file}" MacClippyScaleTests
      - name: Runtime search scale fixture (opt-in)
        timeout-minutes: 10
        env:
          MACCLIPPY_RUN_SCALE_TESTS: "1"
          TEST_RUNNER_MACCLIPPY_RUN_SCALE_TESTS: "1"
        run: |
          set -euo pipefail
          mkdir -p build/ci-runtime-scale
          log_file=build/ci-runtime-scale/xcodebuild-test.log
          xcodebuild test -project MacClippy.xcodeproj -scheme MacClippy \
            -configuration Debug -destination 'platform=macOS,arch=arm64' \
            -derivedDataPath build/ci-runtime-scale/DerivedData \
            -resultBundlePath build/ci-runtime-scale/runtime-scale.xcresult \
            -parallel-testing-enabled NO -maximum-parallel-testing-workers 1 \
            -only-testing:MacClippyTests/MacClippyRuntimeSearchScaleTests \
            -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO 2>&1 | tee "${log_file}"
          ./scripts/assert-opt-in-xctest-log.sh "${log_file}" MacClippyRuntimeSearchScaleTests
      - name: Lifecycle stress fixture
        timeout-minutes: 10
        env:
          MACCLIPPY_RUN_STRESS_TESTS: "1"
        run: swift test --package-path MacClippyKit --filter MacClippyLifecycleStressTests
      - name: Thread Sanitizer package tests
        timeout-minutes: 15
        run: swift test --package-path MacClippyKit --sanitize=thread
      - name: Thread Sanitizer App tests
        timeout-minutes: 20
        run: >-
          xcodebuild test -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/ci-app-tsan
          -resultBundlePath build/ci-app-tsan.xcresult
          -parallel-testing-enabled NO -maximum-parallel-testing-workers 1
          -only-testing:MacClippyTests
          -enableThreadSanitizer YES -skipPackagePluginValidation
          CODE_SIGNING_ALLOWED=NO
      - name: App build
        run: >-
          xcodebuild -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: App Swift 6 warnings-as-errors build
        run: >-
          xcodebuild -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/ci-app-swift6
          -skipPackagePluginValidation SWIFT_VERSION=6.0 CODE_SIGNING_ALLOWED=NO
          build-for-testing
      - name: Shipping configuration compile
        run: >-
          xcodebuild -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Release -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/ci-shipping
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO build
      - name: Verify shipping build settings and metadata
        run: |
          set -euo pipefail
          settings="$(xcodebuild -project MacClippy.xcodeproj -scheme MacClippy -configuration Release -showBuildSettings)"
          hardened_runtime="$(printf '%s\n' "${settings}" | awk -F'= ' '/ENABLE_HARDENED_RUNTIME/ { print $2; exit }')"
          if [[ "${hardened_runtime}" != "YES" ]]; then
            echo "error: Release ENABLE_HARDENED_RUNTIME is not YES" >&2
            exit 1
          fi
          ./scripts/verify-build-metadata.sh \
            build/ci-shipping/Build/Products/Release/MacClippy.app
      - name: App unit tests
        timeout-minutes: 20
        run: >-
          xcodebuild test -project MacClippy.xcodeproj -scheme MacClippy
          -configuration Debug -destination 'platform=macOS,arch=arm64'
          -derivedDataPath build/ci-tests
          -resultBundlePath build/ci-app-tests.xcresult
          -parallel-testing-enabled NO -maximum-parallel-testing-workers 1
          -only-testing:MacClippyTests
          -skipPackagePluginValidation CODE_SIGNING_ALLOWED=NO
      - name: Upload App XCTest result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macclippy-app-tests
          path: build/ci-app-tests.xcresult
          if-no-files-found: warn
      - name: Upload App TSan result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macclippy-app-tsan
          path: |
            build/ci-app-tsan.xcresult
            build/ci-chrome-tsan.xcresult
            build/ci-ui-tests.xcresult
          if-no-files-found: warn
